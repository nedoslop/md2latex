[package]
name = "md2latex-gost"
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
overflow-checks = false
strip = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
comrak = "0.24"
regex = "1"
serde = { version = "1", features = ["derive"] }
tera = "1"
toml = "0.8"
image = "0.24"
printpdf = { version = "0.7", features = ["embedded_images"] }
