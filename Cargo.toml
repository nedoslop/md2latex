[package]
name = "md2latex-gost"
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
overflow-checks = false
strip = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
comrak = "0.59"
regex = "1"
serde = { version = "1", features = ["derive"] }
tera = "1"
toml = "0.9"
image = "0.25"
printpdf = { version = "0.12", features = ["png", "jpeg"] }
serde_yaml = "0.9"
dotenvy    = "0.15"
