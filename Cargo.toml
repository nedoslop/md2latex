[package]
name = "md2latex-gost"
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
overflow-checks = false
strip = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
comrak = "1.0"
regex = "1"
serde = { version = "1", features = ["derive"] }
tera = "2.4"
toml = "1.2"
image = "0.25"
printpdf = { version = "0.12", features = ["png", "jpeg"] }
serde_yaml_ng = "0.10"
dotenvy = "0.15"
console = "0.16"
comfy-table = "8"
reqwest = { version = "0.13", features = ["blocking", "json"] }
serde_json = "1"
sha2 = "0.11"
mimalloc = "0.1"

[build-dependencies]
winresource = "0.1.34"
