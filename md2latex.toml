# ─────────────────────────────────────────────────────────────────────────
# Minimal user configuration. Institution-wide defaults live in the
# profile (`profiles/sibfu/profile.toml`); this file only selects the
# profile, the document type, and supplies per-document title-page data.
#
# Any field from the profile's [style] / [labels] / [lists] / [extra] /
# ... can be overridden here — the user TOML is deep-merged on top of the
# profile TOML.
# ─────────────────────────────────────────────────────────────────────────

[project]
profile     = "profiles/sibfu"
doc_type    = "course_work"
input       = "examples/input.md"
output_dir  = "out"
compile_pdf = true
bib_file    = ""

# ── Title-page data for this specific document ──────────────────────────
# Fields not provided here fall back to the template's own defaults
# (e.g. ministry line, labels) or to the profile's [profile].university.
# `institute` and `department` are intentionally left blank by default —
# the title template prints a placeholder rule in that case.
[title]
institute     = "Институт космических и информационных технологий"
department    = "Кафедра систем искусственного интеллекта"
topic         = "Разработка конвертера Markdown в LaTeX"
supervisor    = "П. П. Петров"
supervisor_title = ""
reviewer      = ""
year          = "2026"
city          = "Красноярск"

[[title.students]]
group      = "ПИ21-01Б"
student_id = "987654321"

[[title.students]]
name       = "И. И. Ветров"

# ── Optional per-document overrides ────────────────────────────────────
# Example: change the SFU ministry line only for this document.
#
# [extra]
# ministry = "Министерство науки и высшего образования РФ"
