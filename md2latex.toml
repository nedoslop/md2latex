[project]
doc_type = "course_work"
input = "examples/input.md"
output_dir = "out"
compile_pdf = true
bib_file = ""

[style]
font = "Times New Roman"
font_fallback = "TeX Gyre Termes"
font_size = "14pt"

margin_left = "30mm"
margin_right = "10mm"
margin_top = "20mm"
margin_bottom = "20mm"

paragraph_indent = "12.5mm"
line_spacing = "onehalf"

numbering = "within_section"

title_page_fill_empty = true

# Все структурные заголовки: центрируются, идут прописными, с новой страницы.
structural_headings = [
    "ВВЕДЕНИЕ",
    "ЗАКЛЮЧЕНИЕ",
    "СОДЕРЖАНИЕ",
    "РЕФЕРАТ",
    "АННОТАЦИЯ",
    "СПИСОК ИСПОЛЬЗОВАННЫХ ИСТОЧНИКОВ",
    "СПИСОК СОКРАЩЕНИЙ",
    "ПРИЛОЖЕНИЕ",
    "ОСНОВНАЯ ЧАСТЬ",
]

# Подразделы под этими заголовками идут БЕЗ номера.
# "ОСНОВНАЯ ЧАСТЬ" сюда не входит — под ней разделы нумеруются.
structural_headings_unnumbered_subsections = [
    "ВВЕДЕНИЕ",
    "ЗАКЛЮЧЕНИЕ",
    "РЕФЕРАТ",
    "АННОТАЦИЯ",
    "СОДЕРЖАНИЕ",
    "СПИСОК ИСПОЛЬЗОВАННЫХ ИСТОЧНИКОВ",
    "СПИСОК СОКРАЩЕНИЙ",
    "ПРИЛОЖЕНИЕ",
]

structural_headings_newpage = true
section_bold = true

figure_caption_below = true
table_caption_above = true

# Дефолтная ширина рисунков (доля от \textwidth), можно переопределить
# в title картинки: "![alt](path "#fig:x width=0.5")".
default_figure_width = "0.8"

[title]
university = "Сибирский федеральный университет"
institute = "Институт космических и информационных технологий"
department = "Кафедра систем искусственного интеллекта"
doc_kind = "КУРСОВАЯ РАБОТА"
direction_code = "09.03.04"
direction_name = "Программная инженерия"
topic = "Разработка конвертера Markdown в LaTeX"
student = "И. И. Иванов"
student_id = "1234567"
group = "ПИ21-01"
supervisor = "П. П. Петров"
supervisor_title = "доцент, канд. техн. наук"
reviewer = ""
year = "2025"
city = "Красноярск"

[bibliography]
use_biblatex = false
