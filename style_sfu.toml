[project]
doc_type = "course_work"
input = "examples/input.md"
output_dir = "out"
compile_pdf = true
bib_file = ""

[style]
# Шрифты по СТУ 7.5-07
font = "Times New Roman"
font_fallback = "TeX Gyre Termes"
font_size = "14pt"
main_font = "Times New Roman"
mono_font = "Courier New"

# Поля по СТУ 7.5-07: левое 30 мм, правое 10 мм, верхнее/нижнее 20 мм
margin_left = "30mm"
margin_right = "10mm"
margin_top = "20mm"
margin_bottom = "20mm"

# Абзацный отступ 1,25 см, полуторный интервал
paragraph_indent = "12.5mm"
line_spacing = "onehalf"

numbering = "within_section"

# Отступы заголовков
section_before_skip = "0pt"
section_after_skip = "12pt"
subsection_before_skip = "12pt"
subsection_after_skip = "6pt"

# Размеры шрифтов для подписей и таблиц
caption_font_size = "12pt"
table_font_size = "12pt"

# Выравнивание заголовков разделов
section_align = "center"
structural_heading_uppercase = true

title_page_fill_empty = true

structural_headings = [
    "ВВЕДЕНИЕ",
    "ЗАКЛЮЧЕНИЕ",
    "СОДЕРЖАНИЕ",
    "РЕФЕРАТ",
    "АННОТАЦИЯ",
    "СПИСОК ИСПОЛЬЗОВАННЫХ ИСТОЧНИКОВ",
    "СПИСОК СОКРАЩЕНИЙ",
    "ПРИЛОЖЕНИЕ",
    "ОСНОВНАЯ ЧАСТЬ",
]

structural_headings_unnumbered_subsections = [
    "ВВЕДЕНИЕ",
    "ЗАКЛЮЧЕНИЕ",
    "РЕФЕРАТ",
    "АННОТАЦИЯ",
    "СОДЕРЖАНИЕ",
    "СПИСОК ИСПОЛЬЗОВАННЫХ ИСТОЧНИКОВ",
    "СПИСОК СОКРАЩЕНИЙ",
    "ПРИЛОЖЕНИЕ",
]

structural_headings_newpage = true
section_bold = true

figure_caption_below = true
table_caption_above = true

default_figure_width = "0.8"

[links]
colored = true
link_color = "black"
cite_color = "black"
url_color = "blue"
boxed = false

[images]
interpolate = true
# convert_to = "pdf"   # раскомментировать, если нужно конвертировать в векторный PDF
dpi = 300

[title]
university = "Сибирский федеральный университет"
institute = "Институт космических и информационных технологий"
department = "Кафедра систем искусственного интеллекта"
doc_kind = "КУРСОВАЯ РАБОТА"
direction_code = "09.03.04"
direction_name = "Программная инженерия"
topic = "Разработка конвертера Markdown в LaTeX"
student = "Иванов Иван Иванович"
student_id = "1234567"
group = "ПИ21-01"
supervisor = "Петров Пётр Петрович"
supervisor_title = "доцент, канд. техн. наук"
reviewer = ""
year = "2025"
city = "Красноярск"

[bibliography]
use_biblatex = false
