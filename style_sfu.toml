[project]
doc_type = "course_work"
input = "examples/input.md"
output_dir = "out"
compile_pdf = true
bib_file = ""

[style]
font = "Times New Roman"
font_fallback = "TeX Gyre Termes"
font_size = "14pt"
main_font = "Times New Roman"
mono_font = "Courier New"

margin_left = "30mm"
margin_right = "10mm"
margin_top = "20mm"
margin_bottom = "20mm"

paragraph_indent = "12.5mm"
line_spacing = "onehalf"
numbering = "within_section"

section_before_skip = "12pt"
section_after_skip = "12pt"
subsection_before_skip = "12pt"
subsection_after_skip = "6pt"

section_align = "center"
section_bold = true
section_uppercase = true

caption_font_size = "14pt"
table_font_size = "12pt"

structural_heading_uppercase = true
title_page_fill_empty = true

structural_headings = [
  "ВВЕДЕНИЕ", "ЗАКЛЮЧЕНИЕ", "СОДЕРЖАНИЕ", "РЕФЕРАТ", "АННОТАЦИЯ",
  "СПИСОК ИСПОЛЬЗОВАННЫХ ИСТОЧНИКОВ", "СПИСОК СОКРАЩЕНИЙ", "ПРИЛОЖЕНИЕ",
]
structural_headings_unnumbered_subsections = [
  "ВВЕДЕНИЕ", "ЗАКЛЮЧЕНИЕ", "РЕФЕРАТ", "АННОТАЦИЯ", "СОДЕРЖАНИЕ",
  "СПИСОК ИСПОЛЬЗОВАННЫХ ИСТОЧНИКОВ", "СПИСОК СОКРАЩЕНИЙ", "ПРИЛОЖЕНИЕ",
]
structural_headings_newpage = true

figure_caption_below = true
table_caption_above = true
default_figure_width = "0.8"

[links]
colored = true
link_color = "black"
cite_color = "black"
url_color = "blue"
boxed = false

[images]
interpolate = true
dpi = 300

